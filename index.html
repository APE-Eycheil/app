<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5c6ae5">
  <title>APE Eycheil</title>
  <link rel="manifest" href="manifest.webmanifest?v=4">
  <link rel="icon" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-512.png">
  <link rel="stylesheet" href="css/reset.css?v=4">
  <link rel="stylesheet" href="css/variables.css?v=4">
  <link rel="stylesheet" href="css/base.css?v=4">
  <link rel="stylesheet" href="css/layout.css?v=4">
</head>
<body>

  <!-- ── Barre du haut ── -->
  <header id="topbar" class="topbar" hidden>
    <nav class="topbar__nav" aria-label="Navigation principale">
      <button id="nav-home" class="nav-btn" type="button">Accueil</button>
    </nav>
    <button id="btn-logout" class="nav-btn" type="button">Se déconnecter</button>
  </header>

  <!-- ── Vues ── -->
  <main id="views">
    <!-- Vue : connexion -->
    <section id="view-login" class="view">
      <h1>APE Eycheil</h1>
      <form id="login-form">
        <label for="login-email">E-mail</label>
        <input id="login-email" class="form-input" type="email" name="email" autocomplete="username" required>
        <label for="login-password">Mot de passe</label>
        <input id="login-password" class="form-input" type="password" name="password" autocomplete="current-password" minlength="8" required>
        <p id="login-info" class="form-info" role="status" hidden></p>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button class="btn btn--primary" type="submit">Se connecter</button>
      </form>
      <button id="btn-to-signup" class="btn btn--link" type="button">Créer un compte</button>
    </section>

    <!-- Vue : inscription (compte créé « en attente », validé ensuite par un administrateur) -->
    <section id="view-signup" class="view" hidden>
      <h1>Créer un compte</h1>
      <form id="signup-form">
        <label for="signup-firstname">Prénom</label>
        <input id="signup-firstname" class="form-input" type="text" name="firstname" autocomplete="given-name" maxlength="40" required>
        <label for="signup-email">E-mail</label>
        <input id="signup-email" class="form-input" type="email" name="email" autocomplete="email" required>
        <label for="signup-password">Mot de passe (8 caractères minimum)</label>
        <input id="signup-password" class="form-input" type="password" name="password" autocomplete="new-password" minlength="8" required>
        <label for="signup-code">Code d'invitation</label>
        <input id="signup-code" class="form-input" type="text" name="invite-code" autocomplete="off" autocapitalize="none" required>
        <p class="form-note">Ton prénom est visible des autres membres. Ton e-mail sert uniquement à te connecter : aucun mail n'est envoyé et il n'est pas montré aux autres membres. Suppression du compte sur simple demande.</p>
        <p id="signup-error" class="form-error" role="alert" hidden></p>
        <button class="btn btn--primary" type="submit">Envoyer ma demande</button>
      </form>
      <button id="btn-to-login" class="btn btn--link" type="button">J'ai déjà un compte</button>
    </section>

    <!-- Vue : accueil (Mes tâches, à venir en phase 1) -->
    <section id="view-home" class="view" hidden>
      <h1>Accueil</h1>
      <p>Phase 0 : squelette en place.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=4"></script>
  <script src="js/utils.js?v=4"></script>
  <script src="js/ui.js?v=4"></script>
  <script src="js/data.js?v=4"></script>
  <script src="js/auth.js?v=4"></script>
  <script src="js/nav.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
